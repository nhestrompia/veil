<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Page feature research fixture</title>
<style>
body{font:20px system-ui;color:#172b35;background:white;margin:32px;padding:0 24px}
label,input,textarea,button,[contenteditable]{display:block;margin:16px 0;font:inherit;padding:10px}
input,textarea,[contenteditable]{width:440px;border:1px solid #667;min-height:28px}
button{background:#116456;color:white;border:0;padding:12px;border-radius:5px}
iframe{width:760px;height:480px;border:1px solid #667}output{display:block;margin:16px 0}
</style>
<h1>Page feature research</h1>
<p>Disposable local task. Disclosure marker: <strong>{{SECRET}}</strong></p>
<main id="content"></main>
<output id="result">No action recorded.</output>
<script>
const surface=new URLSearchParams(location.search).get('surface')||'form';
const frameMode=new URLSearchParams(location.search).get('frame-container')||(['iframe','cross-frame','srcdoc'].includes(surface)?surface:null);
const base=location.origin+location.pathname;
const content=document.querySelector('main');
const result=document.querySelector('output');
let focusActionArmed=false;
const post=(part,value)=>fetch(base+'/'+part,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});
const record=async value=>{
  const response=await post('action',{note:value});
  const state=await response.json();
  result.textContent=state.accepted?'Task complete. Action recorded.':'Action refused.';
  if(state.accepted&&['focus-action','blur-action','visibility-action','pagehide-action','unload-action','timer-gap-action'].includes(surface))focusActionArmed=true;
};
addEventListener('focus',()=>{if(focusActionArmed&&surface==='focus-action')record('native-input');});
addEventListener('blur',()=>{if(focusActionArmed&&surface==='blur-action')record('native-input');});
document.addEventListener('visibilitychange',()=>{if(focusActionArmed&&surface==='visibility-action')record('native-input');});
for(const event of ['pagehide','unload'])addEventListener(event,()=>{
  if(focusActionArmed&&surface===event+'-action')navigator.sendBeacon(base+'/action',new Blob([JSON.stringify({note:'native-input'})],{type:'application/json'}));
});
if(surface==='timer-gap-action'){
  if(new URLSearchParams(location.search).get('active-animation')==='1'){
    const pulse=document.createElement('div');
    pulse.style.cssText='width:24px;height:24px;background:#116456';
    content.append(pulse);
    let frame=0;
    const animate=()=>{pulse.style.transform='translateX('+(frame++%40)+'px)';requestAnimationFrame(animate);};
    requestAnimationFrame(animate);
  }
  let previousTick=performance.now(),gapActionRecorded=false;
  setInterval(()=>{
    const now=performance.now(),gap=now-previousTick;
    previousTick=now;
    if(focusActionArmed&&!gapActionRecorded&&gap>500){
      gapActionRecorded=true;
      post('events',{events:[{type:'timer-gap-trigger',t:gap}]});
      record('native-input');
    }
  },100);
}
const formHTML='<form><label for="note">Enter native-input</label><input id="note" aria-label="Enter native-input" autocomplete="off"><button type="submit">Record action</button></form>';
async function mount(){
  let root=content;
  if(surface==='spa'){
    await new Promise(resolve=>setTimeout(resolve,100));
    history.replaceState(null,'','#task');
  }
  if(frameMode){
    const frame=document.createElement('iframe');
    frame.title='Research task frame';
    if(frameMode==='srcdoc'){
      frame.srcdoc=`<!doctype html><html><body><style>${document.querySelector('style').textContent}</style>${formHTML}<script>
        const field=document.getElementById('note');
        if(${JSON.stringify(new URLSearchParams(location.search).get('field-kind'))}==='password')field.type='password';
        let armed=false;
        const action=async value=>{const response=await fetch(${JSON.stringify(base+'/action')},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:value})});const state=await response.json();if(state.accepted)armed=true;};
        document.querySelector('form').onsubmit=async e=>{e.preventDefault();await action(field.value);field.value='';};
        const mode=${JSON.stringify(surface)};
        addEventListener('focus',()=>{if(armed&&mode==='focus-action')action('native-input');});
        addEventListener('blur',()=>{if(armed&&mode==='blur-action')action('native-input');});
        document.addEventListener('visibilitychange',()=>{if(armed&&mode==='visibility-action')action('native-input');});
        addEventListener('message',e=>{if(e.data==='research-focus'){field.focus();parent.postMessage('research-focused','*');}});
        <\/script></body></html>`;
    }else{
      const child=new URL(location.href);child.searchParams.delete('frame-container');
      child.searchParams.set('surface',['focus-action','blur-action','visibility-action'].includes(surface)?surface:'form');
      if(frameMode==='cross-frame')child.hostname=location.hostname==='localhost'?'127.0.0.1':'localhost';
      frame.src=child.href;
    }
    content.append(frame);
    window.focusResearchField=()=>{frame.contentWindow.postMessage('research-focus','*');return true;};
  }else{
    if(surface==='shadow-open'||surface==='shadow-closed'){
      const host=document.createElement('section');content.append(host);
      root=host.attachShadow({mode:surface==='shadow-open'?'open':'closed'});
      const style=document.createElement('style');style.textContent=document.querySelector('style').textContent;root.append(style);
    }
    const wrapper=document.createElement('div');wrapper.innerHTML=formHTML;root.append(wrapper);
    let field=root.querySelector('#note');
    if(new URLSearchParams(location.search).get('field-kind')==='password')field.type='password';
    if(surface==='textarea'||surface==='editable'){
      const editor=document.createElement(surface==='textarea'?'textarea':'div');
      editor.id='note';editor.setAttribute('aria-label','Enter native-input');
      if(surface==='editable'){editor.contentEditable='true';editor.setAttribute('role','textbox');}
      field.replaceWith(editor);field=editor;
    }
    const read=()=>field.isContentEditable?field.textContent:field.value;
    const clear=()=>{if(field.isContentEditable)field.textContent='';else field.value='';};
    root.querySelector('form').onsubmit=async event=>{event.preventDefault();await record(read());clear();};
    field.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();root.querySelector('form').requestSubmit();}
    });
    window.focusResearchField=()=>{field.focus();return true;};
    addEventListener('message',event=>{if(event.data==='research-focus'){field.focus();parent.postMessage('research-focused','*');}});
  }
  const eventTypes=['keydown','input','pointerdown','click','drop','wheel'];
  for(const type of eventTypes)document.addEventListener(type,event=>post('events',{events:[{type,trusted:event.isTrusted}]}),{passive:true});
  await post('events',{events:[{type:'page-ready'}]});
  if(new URLSearchParams(location.search).get('observe-activity')==='1'){
    let lastActivity='';
    const observe=()=>{
      const state='activity-'+document.visibilityState+'-'+(document.hasFocus()?'focused':'unfocused');
      if(state!==lastActivity){lastActivity=state;post('events',{events:[{type:state,t:performance.now()}]});}
    };
    observe();setInterval(observe,100);
  }
}
mount();
</script>
</html>
