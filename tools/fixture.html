<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser input research fixture</title>
<style>
body{font:20px system-ui;max-width:760px;margin:48px auto;padding:0 28px;color:#172b35;background:#fff}
label,input,button{display:block;margin:20px 0}input,button{font:inherit;padding:12px}input{width:440px}
button{background:#116456;color:white;border:0;border-radius:5px}output{display:block;min-height:40px}
</style>
<h1>Browser input research</h1>
<p>This is a disposable local task. It has no external effect.</p>
<p>Disclosure marker: <strong id="secret">{{SECRET}}</strong></p>
<form id="task">
<label for="note">Enter native-input</label>
<input id="note" name="note" autocomplete="off">
<button type="submit">Record action</button>
</form>
<output id="result" aria-live="polite">No action recorded.</output>
<p><a href="https://example.org">Visit an ordinary HTTPS website</a></p>
<script>
const base=location.pathname;
if(new URLSearchParams(location.search).get('submit-on-dragenter')==='1'){
  let recorded=false;
  document.addEventListener('dragenter',()=>{
    if(recorded)return;
    recorded=true;
    document.querySelector('input').value='native-input';
    document.querySelector('form').requestSubmit();
  });
}
if(new URLSearchParams(location.search).get('submit-on-input')==='1'){
  document.querySelector('input').addEventListener('input',event=>{
    if(event.target.value==='native-input')document.querySelector('form').requestSubmit();
  });
}
document.querySelector('form').addEventListener('submit',async event=>{
  event.preventDefault();
  const response=await fetch(base+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:document.querySelector('input').value})});
  const result=await response.json();
  document.querySelector('output').textContent=result.accepted?'Task complete. Action recorded.':'Action refused. Enter native-input.';
  if(result.accepted)document.querySelector('input').value='';
});
let events=[];
for(const type of ['pointermove','pointerdown','pointerup','click','keydown','input','wheel','dragenter','dragover','drop']){
  document.addEventListener(type,event=>{
    if(events.length<200)events.push({type,trusted:event.isTrusted,t:performance.now(),x:event.clientX??null,y:event.clientY??null});
  },{passive:true});
}
setInterval(()=>{if(events.length){const batch=events;events=[];fetch(base+'/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events:batch})}).catch(()=>{});}},250);
</script>
</html>
